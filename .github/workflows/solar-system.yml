name: Solar System Workflow
on:
  workflow_dispatch:
  push:
    branches:
        - main
        - 'feature/*'

env:
    MONGO_URI: 'mongodb+srv://supercluster.d83jj.mongodb.net/sampleData'
    MONGO_USERNAME: ${{ vars.MONGO_USERNAME }}
    MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}

jobs:
    Unit-Testing:
        name: Unit Testing
        strategy:
          matrix:
            os: [ubuntu-latest, macos-latest, windows-latest]
            node-js-version: [18,19,20]
            exclude:
              - node-js-version: 18
                os: macos-latest
        runs-on: ${{ matrix.os }}
        steps:
         - name: Checkout Action
           uses: actions/checkout@v4

         - name: Setup Node Js Version ${{ matrix.node-js-version }} on OS ${{ matrix.os }}
           uses: actions/setup-node@v4
           with:
            node-version: ${{ matrix.node-js-version }}

         - name: Install Dependencies 
           run: npm install

         - name: Unit Testing
           run: npm test

         - name: Upload Artifact
           uses: actions/upload-artifact@v4
           with:
            name: Mocha-Test-Results
            path: test-results.xml

         - name: Download Artifact
           uses: actions/download-artifact@v4
           with:
            name: Mocha-Test-Results
