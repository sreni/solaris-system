name: Solar System Workflow
on:
  workflow_dispatch:
  push:
    branches:
        - main
        - 'feature/*'
jobs:
    Unit-Testing:
        name: Unit Testing
        runs-on: ubuntu-latest
        steps:
         - name: Checkout Action
           uses: actions/checkout@v4

         - name: Setup Node Js Version - 18
           uses: actions/setup-node@v4
           with:
            node-version: 18

         - name: Install Dependencies
           run: npm install

         - name: Unit Testing
           run: npm test
